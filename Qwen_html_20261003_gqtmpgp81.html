<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nade-AI | Typing Effect</title>
    <style>
        :root { 
            --ocean-dark: #052e26;      
            --ocean-mid: #0d4f40;       
            --ocean-light: #1a7a6b;     
            --ocean-accent: #00ffaa;    
            --text-light: #e0fff5;      
        }
        
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background: linear-gradient(135deg, var(--ocean-dark) 0%, var(--ocean-mid) 100%);
            color: var(--text-light); 
            margin: 0;
            display: flex; 
            justify-content: center; 
            height: 100vh; 
        }
        
        .container { 
            width: 100%; 
            max-width: 900px; 
            border-left: 1px solid var(--ocean-accent); 
            border-right: 1px solid var(--ocean-accent); 
            display: flex; 
            flex-direction: column; 
            background: rgba(5, 46, 38, 0.95);
            box-shadow: 0 0 30px rgba(0, 255, 170, 0.2); 
        }
        
        header { 
            padding: 20px; 
            text-align: center; 
            border-bottom: 1px solid var(--ocean-accent); 
            background: rgba(0, 255, 170, 0.05); 
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        h1 { 
            color: var(--ocean-accent); 
            margin: 0; 
            letter-spacing: 1px; 
            text-shadow: 0 0 10px rgba(0, 255, 170, 0.5);
            font-size: 24px;
        }

        .clear-btn {
            background: transparent;
            border: 1px solid var(--ocean-light);
            color: var(--ocean-light);
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .clear-btn:hover {
            background: rgba(255,0,0,0.2);
            border-color: red;
            color: red;
        }
        
        .api-section {
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid var(--ocean-light);
            display: flex;
            gap: 10px;
        }
        
        .api-input {
            flex: 1;
            padding: 8px;
            background: rgba(5, 46, 38, 0.8);
            border: 1px solid var(--ocean-light);
            color: var(--ocean-accent);
            border-radius: 4px;
            outline: none;
        }
        
        .api-input:focus {
            border-color: var(--ocean-accent);
        }
        
        #chat-box { 
            flex: 1; 
            padding: 20px; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
        }
        
        .message { 
            max-width: 80%; 
            padding: 12px 16px; 
            border-radius: 12px; 
            line-height: 1.5; 
            font-size: 15px; 
            animation: fadeIn 0.3s ease; 
            white-space: pre-wrap; 
        }
        
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        
        .user-msg { 
            align-self: flex-end; 
            background-color: rgba(0, 255, 170, 0.2);
            border: 1px solid var(--ocean-accent); 
            color: white; 
        }
        
        .ai-msg { 
            align-self: flex-start; 
            background-color: rgba(13, 79, 64, 0.6);
            border: 1px solid var(--ocean-light); 
            color: var(--text-light); 
        }

        /* Yanıp sönen imleç efekti */
        .typing-cursor::after {
            content: "▌";
            animation: blink 0.7s infinite;
            color: var(--ocean-accent);
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        
        .input-area { 
            padding: 20px; 
            border-top: 1px solid var(--ocean-accent); 
            display: flex; 
            gap: 10px; 
            background: rgba(0, 0, 0, 0.4); 
        }
        
        textarea { 
            flex: 1; 
            background: rgba(5, 46, 38, 0.8);
            color: white; 
            border: 1px solid var(--ocean-light); 
            padding: 12px; 
            border-radius: 8px; 
            resize: none; 
            height: 50px; 
            font-family: inherit; 
            outline: none; 
        }
        
        textarea:focus { 
            border-color: var(--ocean-accent);
            box-shadow: 0 0 5px rgba(0, 255, 170, 0.3);
        }
        
        button { 
            background: var(--ocean-accent);
            color: var(--ocean-dark);
            border: none; 
            padding: 0 25px; 
            border-radius: 8px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: 0.2s; 
        }
        
        button:hover { 
            background: #33ffcc;
            box-shadow: 0 0 15px var(--ocean-accent);
        }
        
        button:disabled { 
            background: #1a7a6b;
            color: #6bbfa5;
            cursor: not-allowed; 
            box-shadow: none; 
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Nade-AI 🌊</h1>
            <button class="clear-btn" onclick="clearHistory()">Sohbeti Temizle</button>
        </header>
        
        <div class="api-section">
            <input type="password" id="or-key" class="api-input" placeholder="OpenRouter API Key (sk-or-v1...)">
        </div>

        <div id="chat-box">
            <div class="message ai-msg">
                Selam! Ben Nade-AI. Artık yazma efektiyle cevap veriyorum. Nasıl yardımcı olabilirim? 😊
            </div>
        </div>

        <div class="input-area">
            <textarea id="user-input" placeholder="Mesajınızı yazın..."></textarea>
            <button onclick="sendMessage()" id="send-btn">GÖNDER</button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const apiKeyInput = document.getElementById('or-key');
        const sendBtn = document.getElementById('send-btn');

        let chatHistory = [
            { 
                role: "system", 
                content: "Sen Nade-AI'sın. Doğal, samimi, akıcı ve günlük Türkçe konuşan zeki bir asistansın. Robotik, aşırı resmi veya çeviri gibi duran ifadeler kullanma. Bir arkadaş gibi sıcak, kısa, net ve anlaşılır cevaplar ver. Emoji kullanmaktan çekinme." 
            }
        ];

        let isTyping = false; // Yazma efekti devam ediyor mu?

        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        async function sendMessage() {
            const message = userInput.value.trim();
            const apiKey = apiKeyInput.value.trim();
            
            if (!message) return;
            if (!apiKey) {
                alert("Lütfen OpenRouter API anahtarınızı girin!");
                return;
            }
            if (isTyping) return; // Yazma devam ediyorsa yeni mesaj atma

            // Kullanıcı mesajını anında göster
            addMessageInstant(message, 'user-msg');
            chatHistory.push({ role: "user", content: message });
            
            userInput.value = '';
            setLoading(true);

            try {
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${apiKey}`,
                        "Content-Type": "application/json",
                        "HTTP-Referer": window.location.href,
                        "X-Title": "Nade-AI"
                    },
                    body: JSON.stringify({
                        model: "qwen/qwen-2.5-72b-instruct",
                        messages: chatHistory,
                        temperature: 0.7
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error?.message || "API Hatası");
                }

                const data = await response.json();
                const reply = data.choices[0].message.content;

                // YAZMA EFEKTİ İLE GÖSTER
                await typeMessage(reply, 'ai-msg');

                chatHistory.push({ role: "assistant", content: reply });

            } catch (error) {
                addMessageInstant(`Hata: ${error.message}`, 'ai-msg');
                chatHistory.pop(); 
            } finally {
                setLoading(false);
            }
        }

        // ANINDA GÖSTER (Kullanıcı mesajları için)
        function addMessageInstant(text, className) {
            const div = document.createElement('div');
            div.className = `message ${className}`;
            div.textContent = text; 
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // YAZMA EFEKTİ (AI cevapları için)
        function typeMessage(text, className) {
            return new Promise((resolve) => {
                isTyping = true;
                setLoading(true);

                const div = document.createElement('div');
                div.className = `message ${className} typing-cursor`;
                chatBox.appendChild(div);

                let index = 0;
                // Her karakter arası bekleme süresi (milisaniye)
                // Küçük = hızlı, büyük = yavaş
                const speed = 15; 

                const interval = setInterval(() => {
                    if (index < text.length) {
                        div.textContent += text[index];
                        index++;
                        chatBox.scrollTop = chatBox.scrollHeight;
                    } else {
                        clearInterval(interval);
                        div.classList.remove('typing-cursor'); // İmleci kaldır
                        isTyping = false;
                        setLoading(false);
                        resolve();
                    }
                }, speed);
            });
        }

        function setLoading(isLoading) {
            sendBtn.disabled = isLoading;
            userInput.disabled = isLoading;
            sendBtn.innerText = isLoading ? "..." : "GÖNDER";
        }

        function clearHistory() {
            if (isTyping) return; // Yazma sırasında temizleme
            if (confirm("Tüm sohbet geçmişini silmek istediğine emin misin?")) {
                chatHistory = [
                    { 
                        role: "system", 
                        content: "Sen Nade-AI'sın. Doğal, samimi, akıcı ve günlük Türkçe konuşan zeki bir asistansın. Robotik, aşırı resmi veya çeviri gibi duran ifadeler kullanma. Bir arkadaş gibi sıcak, kısa, net ve anlaşılır cevaplar ver." 
                    }
                ];
                chatBox.innerHTML = '<div class="message ai-msg">Sohbet temizlendi. Yeni bir konu açabiliriz! 😊</div>';
            }
        }
    </script>
</body>
</html>
